services:
  haifhemha:
    image: ghcr.io/jbkunama1/haifhemha:latest
    build: .
    container_name: haifhemha
    restart: unless-stopped
    ports:
      - "8090:${PORT:-8080}"
    networks:
      - highfishNetwork
    environment:
      FHEM_URL: "${FHEM_URL:?Set FHEM_URL in Portainer or .env}"
      FHEM_WEB_PATH: "${FHEM_WEB_PATH:-/fhem}"
      FHEM_USER: "${FHEM_USER:-}"
      FHEM_PASS: "${FHEM_PASS:-}"
      APP_PASSWORD: "${APP_PASSWORD:-}"
      PORT: "${PORT:-8080}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT}/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  highfishNetwork:
    external: true
    name: highfishNetwork
